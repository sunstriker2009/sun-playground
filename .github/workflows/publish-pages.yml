name: Publish Playground
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app/**'
      - '.nojekyll'
      - '.github/workflows/publish-pages.yml'
permissions:
  contents: read
concurrency:
  group: playground-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p "$RUNNER_TEMP/playground-pages"
          cp -R index.html app .nojekyll "$RUNNER_TEMP/playground-pages/"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/playground-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
