name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  repository-validation:
    name: repository-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository foundation
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f .github/PULL_REQUEST_TEMPLATE.md
          test -f .github/CODEOWNERS
          test -f docs/REPOSITORY-SETUP.md
          echo "SUN repository foundation valid"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Playground workspace
        run: |
          node --check app/workspace.mjs
          node --test tests/catalog.test.mjs
      - name: Run generated Git snippet tests
        run: node --test tests/runtime/git/catalog.test.mjs
      - name: Run generated JavaScript snippet tests
        run: node --test tests/runtime/javascript/catalog.test.mjs
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Run generated C# snippet tests
        run: dotnet run --project tests/runtime/csharp/CodeFolio.CSharp.RuntimeTests.csproj --configuration Release
      - name: Run generated XPath snippet tests
        shell: bash
        run: |
          node tests/runtime/xpath/generate-tests.mjs |
            dotnet run --project tests/runtime/xpath/CodeFolio.XPath.RuntimeTests.csproj --configuration Release
